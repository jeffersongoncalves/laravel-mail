name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, pgsql]

    name: Tests - ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Run Tests (sqlite)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pest --no-coverage

      - name: Run Tests (mysql)
        if: matrix.database == 'mysql'
        env:
          LARAVEL_MAIL_TEST_DB_DRIVER: mysql
          LARAVEL_MAIL_TEST_DB_HOST: 127.0.0.1
          LARAVEL_MAIL_TEST_DB_PORT: 3306
          LARAVEL_MAIL_TEST_DB_DATABASE: testing
          LARAVEL_MAIL_TEST_DB_USERNAME: root
          LARAVEL_MAIL_TEST_DB_PASSWORD: ''
        run: vendor/bin/pest --no-coverage

      - name: Run Tests (pgsql)
        if: matrix.database == 'pgsql'
        env:
          LARAVEL_MAIL_TEST_DB_DRIVER: pgsql
          LARAVEL_MAIL_TEST_DB_HOST: 127.0.0.1
          LARAVEL_MAIL_TEST_DB_PORT: 5432
          LARAVEL_MAIL_TEST_DB_DATABASE: testing
          LARAVEL_MAIL_TEST_DB_USERNAME: postgres
          LARAVEL_MAIL_TEST_DB_PASSWORD: postgres
        run: vendor/bin/pest --no-coverage
